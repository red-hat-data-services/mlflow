# RPM lockfile input for UBI10 (multi-arch)
#
# Lists RPMs installed via microdnf in the Dockerfile that need to be
# prefetched for hermetic Konflux builds.
#
# Regenerate the lock file with:
#   rpm-lockfile-prototype --outfile requirements/rpms.lock.yaml requirements/rpms.in.yaml
arches:
  - x86_64
  - aarch64
  - ppc64le
  - s390x

contentOrigin:
  repofiles:
    - ubi.repo

packages:
  # runtime
  - openblas-threads
  - libpq
  - python3
  - python3-pip
  - sqlite
  # python-builder (psycopg2 sdist needs pg_config + C toolchain on UBI10)
  - libpq-devel
  - gcc
  - python3-devel

context:
  containerfile:
    file: ../Dockerfile.konflux
    stageName: runtime
